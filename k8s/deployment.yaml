apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-diabetes-app
  labels:
    app: diabetes-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diabetes-predictor
  template:
    metadata:
      labels:
        app: diabetes-predictor
    spec:
      containers:
      - name: streamlit-app
        image: diabetes-predictor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
